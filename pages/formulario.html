<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Avaliação</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="pagina-formulario">

    <header class="destaque">
        <div class="emblema-destaque">AVALIAÇÃO · PLACA MÃE</div>
        <h1>Deixe seu Feedback</h1>
        <p class="subtitulo-destaque">Ajude-nos a aprimorar esta ferramenta educacional sobre arquitetura</p>
        <div class="linha-destaque"></div>
    </header>

    <main class="container-formulario">
        <h3>Formulário de Avaliação</h3>
        
        <form id="formulario-feedback" onsubmit="handleSubmit(event)">
            <!-- Nome e Email -->
            <div class="linha-formulario">
                <div class="grupo-formulario">
                    <label for="entrada-nome">Nome Completo</label>
                    <input type="text" id="entrada-nome" required placeholder="Digite seu nome...">
                </div>
                <div class="grupo-formulario">
                    <label for="entrada-email">E-mail</label>
                    <input type="email" id="entrada-email" required placeholder="Digite seu e-mail...">
                </div>
            </div>

            <!-- Interesse e Avaliação -->
            <div class="linha-formulario">
                <div class="grupo-formulario">
                    <label for="selecao-interesse">Componente mais Interessante</label>
                    <select id="selecao-interesse">
                        <option value="Processador">Processador (CPU)</option>
                        <option value="MemoriaRam">Memória RAM</option>
                        <option value="PCIExpress">Slots PCI Express</option>
                        <option value="Armazenamento">Armazenamento (SSD/HD)</option>
                        <option value="VRMEnergia">VRM e Fonte de Alimentação</option>
                        <option value="USB">Conectores USB / E-S</option>
                    </select>
                </div>
                <div class="grupo-formulario">
                    <label>Sua nota para o site</label>
                    <div class="container-avaliacao">
                        <span class="estrela-avaliacao" onclick="setRating(1)">★</span>
                        <span class="estrela-avaliacao" onclick="setRating(2)">★</span>
                        <span class="estrela-avaliacao" onclick="setRating(3)">★</span>
                        <span class="estrela-avaliacao" onclick="setRating(4)">★</span>
                        <span class="estrela-avaliacao" onclick="setRating(5)">★</span>
                    </div>
                    <input type="hidden" id="entrada-nota" value="0" required>
                </div>
            </div>

            <!-- Comentário -->
            <div class="grupo-formulario" style="margin-bottom: 25px;">
                <label for="area-comentarios">Comentários e Sugestões</label>
                <textarea id="area-comentarios" placeholder="Diga o que achou da plataforma e o que podemos melhorar..."></textarea>
            </div>

            <button type="submit" class="botao-enviar">Enviar Avaliação ➔</button>
        </form>

        <div id="alerta-sucesso" class="mensagem-sucesso">
            SISTEMA: AVALIAÇÃO PROCESSADA COM SUCESSO! OBRIGADO PELO SEU FEEDBACK.
        </div>
    </main>

    <button class="botao-voltar" onclick="window.location.href='../index.html'">Voltar para Home</button>

    <script>
        let currentRating = 0;

        function setRating(rating) {
            currentRating = rating;
            document.getElementById('entrada-nota').value = rating;
            
            const stars = document.querySelectorAll('.estrela-avaliacao');
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            if (currentRating === 0) {
                alert("Por favor, selecione uma nota de 1 a 5 estrelas.");
                return;
            }

            // Exibir mensagem de sucesso
            document.getElementById('formulario-feedback').style.display = 'none';
            document.getElementById('alerta-sucesso').style.display = 'block';
        }
    </script>
</body>
</html>
