<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>projeto placa mae</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-mapa">
  <div class="container-mapa">
    <header class="destaque">
      <div class="emblema-destaque">DIAGRAMA INTERATIVO · PLACA MÃE</div>
      <h1>Mapa Interativo</h1>
      <p class="subtitulo-destaque">Clique nas áreas destacadas da placa-mãe para explorar seus componentes</p>
      <div class="linha-destaque"></div>
    </header>
    <img src="../images/placa mae/91lKZoY9CWL._AC_SX679_.jpg" usemap="#placaMaeMap" width="679" height="653" class="imagem-central" />

    <map name="placaMaeMap">
      <area shape="rect" coords="103,15,50,350" href="ConectoresUsb(index).html" alt="Dissipador VRM"
        title="Dissipador do VRM">
      <area shape="rect" coords="220,20,430,140" href="FonteDeEnergia(index).html" alt="VRM"
        title="Circuito Regulador de Tensão (VRM)">
      <area shape="rect" coords="280,155,405,280" href="Processador(index).html" alt="Soquete do Processador"
        title="Soquete do Processador (AM4)">
      <area shape="rect" coords="445,75,535,365" href="MemoriaRam(index).html" alt="Slots de Memória RAM"
        title="Slots de Memória RAM (DDR4)">
      <area shape="rect" coords="590,125,655,335" href="FonteDeEnergia(index).html" alt="Conector ATX 24 pinos"
        title="Conector ATX 24 pinos (Alimentação Principal)">
      <area shape="rect" coords="0,265,58,525" href="ConectoresUsb(index).html" alt="Portas USB Traseiras"
        title="Portas USB Traseiras (USB 2.0 / 3.2)">
      <area shape="rect" coords="110,420,495,465" href="SlotPCIExpress(index).html" alt="PCI Express x16"
        title="Slot PCI Express x16">
      <area shape="circle" coords="200,548,38" href="BateriaCmos(index).html" alt="Bateria CMOS"
        title="Bateria CMOS (CR2032)">
      <area shape="rect" coords="425,470,555,595" href="SlotPCIExpress(index).html" alt="Chipset"
        title="Chipset AMD A520">
      <area shape="rect" coords="510,585,679,653" href="MemoriaSecundaria(index).html" alt="Portas SATA"
        title="Portas SATA (Armazenamento)">
      <area shape="rect" coords="0,530,100,653" href="ConectoresUsb(index).html" alt="Áudio Onboard"
        title="Circuito de Áudio Onboard">
      <area shape="rect" coords="575,345,675,410" href="ConectoresUsb(index).html" alt="Header USB 3.2"
        title="Header USB 3.2 Gen 1 (U32G1_12)">
      <area shape="rect" coords="215,595,395,653" href="ConectoresUsb(index).html" alt="USB Interno"
        title="Conectores USB Internos (USB_12 / USB_34)">
      <area shape="rect" coords="340,610,510,653" href="ConectoresUsb(index).html" alt="Painel Frontal"
        title="Conectores do Painel Frontal">
    </map>
    <button class="botao-voltar" onclick="window.location.href='../index.html'">Voltar para Home</button>
  </div>

  <script>
    window.addEventListener('load', function () {
      var img = document.querySelector('.imagem-central');
      var areas = document.querySelectorAll('area');
      var originalWidth = 679;

      for (var i = 0; i < areas.length; i++) {
        areas[i].setAttribute('data-original-coords', areas[i].coords);
      }

      function resizeMap() {
        var currentWidth = img.clientWidth;
        if (currentWidth === 0) return;
        var scale = currentWidth / originalWidth;

        for (var i = 0; i < areas.length; i++) {
          var originalCoords = areas[i].getAttribute('data-original-coords');
          var coords = originalCoords.split(',');
          var scaled = [];
          for (var j = 0; j < coords.length; j++) {
            scaled.push(Math.round(Number(coords[j]) * scale));
          }
          areas[i].coords = scaled.join(',');
        }
      }

      resizeMap();
      window.addEventListener('resize', resizeMap);
    });
  </script>
</body>

</html>
